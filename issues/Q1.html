<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Trafficking Graphs — Q1</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q1")</script></head><body><main id="issue"><h2 class="desk">Q1. Scale and definitions: why estimates differ by 1,000x</h2><figure class="g"><img src="img/Q1-01.webp" alt="Modern slavery in the United States: Global Slavery Index 2023 country study (key stats: 1,091,000; 3.3 per 1,000)" loading="lazy"><figcaption><span class="t">Modern slavery in the United States: Global Slavery Index 2023 country study (key stats: 1,091,000; 3.3 per 1,000).</span> Walk Free, Global Slavery Index 2023 | Date: 2023. Modeled estimate of people in modern slavery in the U.S. on any given day (1,091,000), vulnerability and government-response scores. Extrapolated from GEMS surveys in other countries via vulnerability model; no U.S. survey behind it. Contested (see Q6)<br><span class="s">Source: <a href="https://cdn.walkfree.org/content/uploads/2023/11/14130741/gsi-country-study-usa.pdf" target="_blank" rel="noopener">https://cdn.walkfree.org/content/uploads/2023/11/14130741/gsi-country-study-usa.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q1-02.webp" alt="TVV derived: orders of magnitude, from 210 convictions to 49.6 million (log scale)" loading="lazy"><figcaption><span class="t">TVV derived: orders of magnitude, from 210 convictions to 49.6 million (log scale).</span> TVV derived from GEMS 2022, GSI 2023, TIP 2025, USCIS, Polaris, UNODC/OWID, BJS, ICE | Date: Built 2026-10-17. Each bar is a different definition and year; modeled estimates vs reports vs adjudicated cases<br><span class="s">Source: <a href="https://www.ilo.org/publications/major-publications/global-estimates-modern-slavery-forced-labour-and-forced-marriage" target="_blank" rel="noopener">https://www.ilo.org/publications/major-publications/global-estimates-modern-slavery-forced-labour-and-forced-marriage</a> <a href="https://cdn.walkfree.org/content/uploads/2023/11/14130741/gsi-country-study-usa.pdf" target="_blank" rel="noopener">https://cdn.walkfree.org/content/uploads/2023/11/14130741/gsi-country-study-usa.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q1-03.webp" alt="The number of people in modern slavery has risen in recent years (2016 vs 2021)" loading="lazy"><figcaption><span class="t">The number of people in modern slavery has risen in recent years (2016 vs 2021).</span> ILO, Walk Free and IOM, Global Estimates of Modern Slavery 2022, Figure 2 | Date: Sept 2022. Modeled number of people in modern slavery on any given day: 40.3M (2016) to 49.6M (2021); forced labour 24.9M to 27.6M; forced marriage 15.4M to 22.0M. Modern slavery = forced labour (incl. forced commercial sexual exploitation and state-imposed) + forced marriage. Not a legal term; wider than &quot;trafficking&quot;<br><span class="s">Source: <a href="https://www.ilo.org/publications/major-publications/global-estimates-modern-slavery-forced-labour-and-forced-marriage" target="_blank" rel="noopener">https://www.ilo.org/publications/major-publications/global-estimates-modern-slavery-forced-labour-and-forced-marriage</a> <a href="https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@ipec/documents/publication/wcms_854733.pdf" target="_blank" rel="noopener">https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@ipec/documents/publication/wcms_854733.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q1-04.webp" alt="Forced labour increased since 2016 in both absolute and relative terms" loading="lazy"><figcaption><span class="t">Forced labour increased since 2016 in both absolute and relative terms.</span> ILO, Walk Free and IOM, GEMS 2022, Figure 3 | Date: Sept 2022. Number and prevalence (per 1,000 population) of people in forced labour, 2016 and 2021. ILO Forced Labour Convention 1930: work exacted under menace of penalty and not offered voluntarily<br><span class="s">Source: <a href="https://www.ilo.org/publications/major-publications/global-estimates-modern-slavery-forced-labour-and-forced-marriage" target="_blank" rel="noopener">https://www.ilo.org/publications/major-publications/global-estimates-modern-slavery-forced-labour-and-forced-marriage</a> <a href="https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@ipec/documents/publication/wcms_854733.pdf" target="_blank" rel="noopener">https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@ipec/documents/publication/wcms_854733.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q1-05.webp" alt="Involuntariness in work can arise from an array of work conditions" loading="lazy"><figcaption><span class="t">Involuntariness in work can arise from an array of work conditions.</span> ILO, Walk Free and IOM, GEMS 2022, Figure 11 | Date: Sept 2022. Share of people in forced labour exploitation reporting each condition (by sex). Shows how survey answers are coded into &quot;forced labour&quot;; one reason modeled totals are far above detected cases<br><span class="s">Source: <a href="https://www.ilo.org/publications/major-publications/global-estimates-modern-slavery-forced-labour-and-forced-marriage" target="_blank" rel="noopener">https://www.ilo.org/publications/major-publications/global-estimates-modern-slavery-forced-labour-and-forced-marriage</a> <a href="https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@ipec/documents/publication/wcms_854733.pdf" target="_blank" rel="noopener">https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@ipec/documents/publication/wcms_854733.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q1-06.webp" alt="Global trend of detection rates, base year 2019 (detected victims +25% in 2022)" loading="lazy"><figcaption><span class="t">Global trend of detection rates, base year 2019 (detected victims +25% in 2022).</span> UNODC Global Report on Trafficking in Persons 2024, Fig. 1 | Date: Dec 2024. Change in victims detected per 100,000 population vs 2019, based on 125 countries. Detected = identified by national authorities. Rises can mean more trafficking OR more detection<br><span class="s">Source: <a href="https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf" target="_blank" rel="noopener">https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q1-07.webp" alt="Trends in detection rates in 2022 compared with 2019 and 2021, by region" loading="lazy"><figcaption><span class="t">Trends in detection rates in 2022 compared with 2019 and 2021, by region.</span> UNODC GLOTIP 2024, Fig. 2 | Date: Dec 2024. Percent change in detected victims per region. Detected victims; country coverage varies by year<br><span class="s">Source: <a href="https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf" target="_blank" rel="noopener">https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q1-08.webp" alt="Global trend on detection rates of trafficking victims by form of exploitation, 2003-2022" loading="lazy"><figcaption><span class="t">Global trend on detection rates of trafficking victims by form of exploitation, 2003-2022.</span> UNODC GLOTIP 2024, Fig. 6 | Date: Dec 2024. Detected victims per 100,000: total, sexual exploitation, forced labour, other. Detected victims; forced labour rose 47% vs 2019 per UNODC<br><span class="s">Source: <a href="https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf" target="_blank" rel="noopener">https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q1-09.webp" alt="Trends in detection rates of trafficking victims, by regions, base year 2019" loading="lazy"><figcaption><span class="t">Trends in detection rates of trafficking victims, by regions, base year 2019.</span> UNODC GLOTIP 2024, Fig. 26 | Date: Dec 2024. Indexed detection trend per region 2019-2022. Detected victims<br><span class="s">Source: <a href="https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf" target="_blank" rel="noopener">https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q1-10.webp" alt="Human trafficking victims officially detected by national authorities, selected countries" loading="lazy"><figcaption><span class="t">Human trafficking victims officially detected by national authorities, selected countries.</span> Our World in Data, from UNODC | Date: Downloaded 2026-10-17 (data to 2022-23). Detected victims per country per year (USA, UK, Netherlands, Mexico, Philippines, Nigeria, Romania). UN SDG 16.2.2 detected victims; depends on law and enforcement practice in each country<br><span class="s">Source: <a href="https://ourworldindata.org/grapher/human-trafficking-victims" target="_blank" rel="noopener">https://ourworldindata.org/grapher/human-trafficking-victims</a> <a href="https://ourworldindata.org/grapher/human-trafficking-victims.png" target="_blank" rel="noopener">https://ourworldindata.org/grapher/human-trafficking-victims.png</a></span></figcaption></figure></main></body></html>
