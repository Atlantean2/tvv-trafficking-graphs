<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Trafficking Graphs — Q8</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q8")</script></head><body><main id="issue"><h2 class="desk">Q8. Victims by Region</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-10-25-T2.webp" alt="Victims identified worldwide by region, and the rise of forced labor" loading="lazy"><figcaption><span class="t">Chart T2 (week of Oct 25, 2026). Victims identified worldwide by region, and the rise of forced labor</span><p>Governments identified a record 156,912 trafficking victims in 2025 (2026 TIP Report), up 54% on 2024 and 40% on 2019. South &amp; Central Asia (68,787) and Europe (36,109, nearly double 2024) drove the increase. Labor trafficking victims rose from 13,875 (12% of the total) in 2019 to 43,342 (28%) in 2025. Caution: these are victims identified by authorities, not prevalence; a jump can mean better screening as much as more crime. The EU&#x27;s Oct 16, 2026 strategy separately reports 20,000+ registered victims in 2023-24 (+16.1% vs 2021-22).</p><p>Sources: <a href="https://www.state.gov/reports/2026-trafficking-in-persons-report">US State Dept, 2026 TIP Report, regional and global data tables</a> <a href="https://home-affairs.ec.europa.eu/news/new-strategy-combating-trafficking-human-beings-2026-10-16_en">European Commission, EU anti-trafficking strategy, Oct 16, 2026</a></p></figcaption></figure></main></body></html>
