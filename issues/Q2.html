<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Trafficking Graphs — Q2</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q2")</script></head><body><main id="issue"><h2 class="desk">Q2. Measured U.S. counts: prosecutions, convictions, visas, hotline</h2><figure class="g"><img src="img/Q2-01.webp" alt="TVV derived: T-visa applications vs approvals vs the 5,000 cap, FY2008-FY2026 Q3" loading="lazy"><figcaption><span class="t">TVV derived: T-visa applications vs approvals vs the 5,000 cap, FY2008-FY2026 Q3.</span> TVV derived from USCIS Form I-914 statistics | Date: Built 2026-10-17. T-1 principal victims; applications are claims, approvals are adjudicated<br><span class="s">Source: <a href="https://www.uscis.gov/sites/default/files/document/data/i914t_visastatistics_fy2026_q3_v1.xlsx" target="_blank" rel="noopener">https://www.uscis.gov/sites/default/files/document/data/i914t_visastatistics_fy2026_q3_v1.xlsx</a> <a href="https://www.uscis.gov/newsroom/alerts/uscis-restores-integrity-to-the-vawa-t-nonimmigrant-and-u-nonimmigrant-programs-after-suspected" target="_blank" rel="noopener">https://www.uscis.gov/newsroom/alerts/uscis-restores-integrity-to-the-vawa-t-nonimmigrant-and-u-nonimmigrant-programs-after-suspected</a></span></figcaption></figure>
<figure class="g"><img src="img/Q2-02.webp" alt="Human trafficking suspects referred to and prosecuted by U.S. attorneys and defendants convicted, FY2012-2022" loading="lazy"><figcaption><span class="t">Human trafficking suspects referred to and prosecuted by U.S. attorneys and defendants convicted, FY2012-2022.</span> Bureau of Justice Statistics, Human Trafficking Data Collection Activities 2024, Figure 1 | Date: Oct 2024, revised July 23, 2026. FY2022: 1,912 referred, 1,144 prosecuted, 1,118 convicted. Broad federal definition: peonage/slavery/forced labor/sex trafficking (18 USC 1581-1595) PLUS child sexual exploitation (2251) and transportation for illegal sexual activity (2422-2423). About 4x the DOJ narrow count in the TIP report<br><span class="s">Source: <a href="https://bjs.ojp.gov/document/htdca24.pdf" target="_blank" rel="noopener">https://bjs.ojp.gov/document/htdca24.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q2-03.webp" alt="TVV derived: federal trafficking cases, broad BJS vs narrow DOJ count, FY2012-FY2024" loading="lazy"><figcaption><span class="t">TVV derived: federal trafficking cases, broad BJS vs narrow DOJ count, FY2012-FY2024.</span> TVV derived from BJS HTDCA 2024 and State Dept TIP Reports (DOJ data) | Date: Built 2026-10-17. BJS includes child sexual exploitation statutes; DOJ narrow = trafficking statutes only<br><span class="s">Source: <a href="https://bjs.ojp.gov/document/htdca24.pdf" target="_blank" rel="noopener">https://bjs.ojp.gov/document/htdca24.pdf</a> <a href="https://www.state.gov/reports/2025-trafficking-in-persons-report/united-states/" target="_blank" rel="noopener">https://www.state.gov/reports/2025-trafficking-in-persons-report/united-states/</a></span></figcaption></figure>
<figure class="g"><img src="img/Q2-04.webp" alt="Key findings for North America, 2022: detected victims +78% vs 2019, convictions -28%" loading="lazy"><figcaption><span class="t">Key findings for North America, 2022: detected victims +78% vs 2019, convictions -28%.</span> UNODC GLOTIP 2024, North America regional overview | Date: Dec 2024. Victims detected and convictions vs 2019; 56% women, 25% girls; 69% sexual exploitation; 75% trafficked domestically. North America = USA, Canada, Mexico (government-reported detected victims)<br><span class="s">Source: <a href="https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf" target="_blank" rel="noopener">https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q2-05.webp" alt="Trend in victims detected per 100,000 population in North America" loading="lazy"><figcaption><span class="t">Trend in victims detected per 100,000 population in North America.</span> UNODC GLOTIP 2024, Fig. 130 | Date: Dec 2024. Detected victims per 100,000 population by year. Detected victims<br><span class="s">Source: <a href="https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf" target="_blank" rel="noopener">https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q2-06.webp" alt="Share of detected victims in North America by form of exploitation, 2022" loading="lazy"><figcaption><span class="t">Share of detected victims in North America by form of exploitation, 2022.</span> UNODC GLOTIP 2024, Fig. 131 | Date: Dec 2024. Sexual exploitation vs forced labour vs other. Detected victims<br><span class="s">Source: <a href="https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf" target="_blank" rel="noopener">https://www.unodc.org/documents/data-and-analysis/glotip/2024/GLOTIP2024_BOOK.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q2-07.webp" alt="National Human Trafficking Hotline 2024: signals, situations and victims identified" loading="lazy"><figcaption><span class="t">National Human Trafficking Hotline 2024: signals, situations and victims identified.</span> Polaris, Annual Report 2024 (page 3) | Date: Aug 2025. Hotline contacts (signals), likely trafficking situations and victims in 2024. Hotline reports, not verified or adjudicated cases; one victim can appear in several reports<br><span class="s">Source: <a href="https://polarisproject.org/wp-content/uploads/2025/08/Polaris-Annual-Report-2024-rev.pdf" target="_blank" rel="noopener">https://polarisproject.org/wp-content/uploads/2025/08/Polaris-Annual-Report-2024-rev.pdf</a></span></figcaption></figure>
<figure class="g"><img src="img/Q2-08.webp" alt="Number of law enforcement contacts in Trafficking Hotline reporting protocols, 2020-2024" loading="lazy"><figcaption><span class="t">Number of law enforcement contacts in Trafficking Hotline reporting protocols, 2020-2024.</span> Polaris, Annual Report 2024 (page 9) | Date: Aug 2025. Law enforcement agencies the hotline can refer to (up 25% in 5 years). Capacity measure, not a victim count<br><span class="s">Source: <a href="https://polarisproject.org/wp-content/uploads/2025/08/Polaris-Annual-Report-2024-rev.pdf" target="_blank" rel="noopener">https://polarisproject.org/wp-content/uploads/2025/08/Polaris-Annual-Report-2024-rev.pdf</a></span></figcaption></figure></main></body></html>
