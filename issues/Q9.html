<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Trafficking Graphs — Q9</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q9")</script></head><body><main id="issue"><h2 class="desk">Q9. EU Victims</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-11-01-T3.webp" alt="Europe&#x27;s forced-labour trafficking has caught up with sex trafficking" loading="lazy"><figcaption><span class="t">Chart T3 (week of Nov 1, 2026). Europe&#x27;s forced-labour trafficking has caught up with sex trafficking</span><p>Registered trafficking victims in EU countries (Eurostat crim_thb_vexp, updated Jun 2026; summed over the 25-26 EU states that report each year). Victims of forced labour or services rose from 980 in 2018 to 3,508 in 2024, while sexual-exploitation victims stayed near 4,000 (4,296 in 2024). In 2018 labour cases were a quarter the size of sex-trafficking cases; by 2024 they were 82% of it.</p><ul><li>Biggest 2024 labour-trafficking counts: France 752 (80 in 2018), Italy 749 (61), Netherlands 356, Spain 246, Poland 223, Greece 215.</li><li>The Commission&#x27;s Sixth Progress Report (Oct 16, 2026) counts 20,022 registered victims in 2023-2024, up 16.1% on 17,248 in 2021-2022; women and girls were 63%.</li></ul><p class="nt">Note: Registered victims depend on how hard each country looks; a rise can mean more enforcement, not only more trafficking. Finland is missing for 2024; Germany&#x27;s 2022 labour figure (1,019) is an outlier against 171 in 2024. Victims can be counted under more than one form.</p><p>Sources: <a href="https://ec.europa.eu/eurostat/databrowser/view/crim_thb_vexp/default/table">Eurostat crim_thb_vexp, victims by form of exploitation</a> <a href="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/crim_thb_vexp?format=JSON&amp;lang=EN">Eurostat API, crim_thb_vexp</a> <a href="https://home-affairs.ec.europa.eu/news/new-strategy-combating-trafficking-human-beings-2026-10-16_en">European Commission, Sixth progress report on trafficking, COM(2026) 557, Oct 16 2026</a> <a href="https://www.parliament.bg/pub/ECD/8658411_EN_ACT_part1_v5.pdf">COM(2026) 557 final, full text (PDF)</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-01-T4.webp" alt="Most trafficking victims found in the EU now come from outside it" loading="lazy"><figcaption><span class="t">Chart T4 (week of Nov 1, 2026). Most trafficking victims found in the EU now come from outside it</span><p>Registered trafficking victims in EU countries by citizenship (Eurostat crim_thb_vctz, updated Sep 10, 2026). Non-EU citizens were 5,812 of 9,153 victims in 2024 (63%), up from 37% in 2010; victims from other EU countries fell from 1,452 to 718. The jump came in 2022, the year of Russia&#x27;s full-scale invasion of Ukraine.</p><ul><li>Non-EU victims by country, 2024: Italy 1,871 (314 in 2021), France 1,044, Netherlands 498, Spain 479, Greece 403.</li><li>Intra-EU trafficking (e.g. Romanian and Bulgarian victims) is shrinking as a share, while victims from outside the EU dominate.</li></ul><p class="nt">Note: Sweden did not report citizenship for 2024. Counts are registered victims only; the Commission says the actual number is &quot;certainly higher&quot; than reported. The 2022 timing matches the Ukraine refugee flow, but Eurostat does not break out Ukrainians here, so the link is not proven by this table.</p><p>Sources: <a href="https://ec.europa.eu/eurostat/databrowser/view/crim_thb_vctz/default/table">Eurostat crim_thb_vctz, victims by citizenship</a> <a href="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/crim_thb_vctz?format=JSON&amp;lang=EN">Eurostat API, crim_thb_vctz</a> <a href="https://home-affairs.ec.europa.eu/news/new-strategy-combating-trafficking-human-beings-2026-10-16_en">European Commission, Sixth progress report on trafficking, COM(2026) 557, Oct 16 2026</a> <a href="https://www.parliament.bg/pub/ECD/8658411_EN_ACT_part1_v5.pdf">COM(2026) 557 final, full text (PDF)</a></p></figcaption></figure></main></body></html>
