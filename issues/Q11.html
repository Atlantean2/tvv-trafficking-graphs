<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Trafficking Graphs — Q11</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q11")</script></head><body><main id="issue"><h2 class="desk">Q11. Prosecutions</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-11-15-T7.webp" alt="EU trafficking suspects have nearly tripled since 2013; convictions have not kept pace" loading="lazy"><figcaption><span class="t">Chart T7 (week of Nov 15, 2026). EU trafficking suspects have nearly tripled since 2013; convictions have not kept pace</span><p>Persons registered by police and courts across EU reporting countries for trafficking in human beings, 2008–2024 (Eurostat, published Sep 2026). Suspected traffickers rose from 2,942 in 2013 to 7,966 in 2024 (2.7x), peaking at 9,647 in 2021. Convictions reached 2,601 in 2024 — about one for every 3.1 suspects, versus one per 2.0 in 2013. Registered victims hit a record 10,556 in 2023 and were 9,466 in 2024, 30% above the 2008–2021 average (7,280).</p><ul><li>Convictions per suspect: 49% in 2013, 22% in 2019, 33% in 2024.</li><li>Victims registered per conviction in 2024: 3.6.</li><li>France alone accounted for 1,214 of the 2,601 EU convictions in 2024 (see T8).</li></ul><p class="nt">Note: EU_V is Eurostat&#x27;s total of the EU countries that reported each year; country coverage varies (the 2018 conviction figure is low because some large countries did not report). Suspects, convictions and victims in a given year are not the same cases: a conviction can follow a suspicion registered years earlier. Victims are &#x27;registered&#x27; (identified or presumed) victims, which depends heavily on national identification systems.</p><p>Sources: <a href="https://ec.europa.eu/eurostat/databrowser/view/crim_thb_sex/default/table">Eurostat crim_thb_sex: trafficking in human beings, victims, suspects and convicted persons by sex (updated Sep 9 2026)</a> <a href="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/crim_thb_sex?format=JSON&amp;lang=EN&amp;sex=T&amp;unit=NR">Eurostat dissemination API (JSON) download</a> <a href="https://ec.europa.eu/eurostat/cache/metadata/en/crim_thb_esms.htm">Eurostat metadata: trafficking in human beings statistics</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-15-T8.webp" alt="One country produced 47% of EU trafficking convictions; Sweden convicted no one" loading="lazy"><figcaption><span class="t">Chart T8 (week of Nov 15, 2026). One country produced 47% of EU trafficking convictions; Sweden convicted no one</span><p>Registered victims, suspected and convicted traffickers in 2024 for every EU state that registered at least 100 victims (Eurostat, published Sep 2026). France recorded 1,214 convictions — 47% of the EU total of 2,601 — against 2,127 victims. Elsewhere the gap between victims found and traffickers convicted is wide: the Netherlands registered 944 victims and convicted 43 traffickers (22 victims per conviction), Austria 432 victims and 6 convictions, Sweden 196 victims and zero convictions. Italy had the most suspects (2,573) but 449 convictions; Germany 778 suspects and 143 convictions.</p><ul><li>Hungary (171 convictions, 152 suspects) and Greece (143 convictions) also convicted at high rates relative to suspects.</li><li>Poland registered 316 victims and convicted 14; Portugal 213 victims and 9 convictions.</li><li>Outside this EU dataset, the Crown Prosecution Service for England and Wales published its Modern Slavery National Scrutiny Panel &#x27;learning and action&#x27; note on Nov 9 2026.</li></ul><p class="nt">Note: National definitions and counting rules differ: some countries count convictions under trafficking law only, others include related offences; France&#x27;s high count may partly reflect broader legal coding (for example procuring). Victims, suspects and convictions in the same year are not the same cases. Finland did not report convictions for 2024.</p><p>Sources: <a href="https://ec.europa.eu/eurostat/databrowser/view/crim_thb_sex/default/table">Eurostat crim_thb_sex: trafficking in human beings, victims, suspects and convicted persons by sex (updated Sep 9 2026)</a> <a href="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/crim_thb_sex?format=JSON&amp;lang=EN&amp;sex=T&amp;unit=NR">Eurostat dissemination API (JSON) download</a> <a href="https://ec.europa.eu/eurostat/cache/metadata/en/crim_thb_esms.htm">Eurostat metadata: trafficking in human beings statistics</a> <a href="https://www.cps.gov.uk/publication/cps-modern-slavery-national-scrutiny-panel-learning-and-action">CPS Modern Slavery National Scrutiny Panel: learning and action (Nov 9 2026)</a></p></figcaption></figure></main></body></html>
