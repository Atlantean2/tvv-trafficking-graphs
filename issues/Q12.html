<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Trafficking Graphs — Q12</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q12")</script></head><body><main id="issue"><h2 class="desk">Q12. TIP Tiers</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-11-22-T9.webp" alt="TIP 2026: 35 countries in Tier 1, the most in three years; watch list cut to 18" loading="lazy"><figcaption><span class="t">Chart T9 (week of Nov 22, 2026). TIP 2026: 35 countries in Tier 1, the most in three years; watch list cut to 18</span><p>How the US State Department graded 188 governments&#x27; anti-trafficking efforts in its last three Trafficking in Persons reports. The 2026 report, published about three months late, covers April 2025 to March 2026. It placed 35 countries in Tier 1 (fully meeting US minimum standards), up from 33, and shrank the Tier 2 Watch List from 32 in 2024 to 18; Tier 3, the worst grade, which can trigger US aid restrictions, held at 20. The grades sit awkwardly beside the report&#x27;s own numbers: it records the most victims identified and the most prosecutions ever, and La Strada International notes that Europe identified 36,109 victims but recorded only 1,360 convictions. Tier placements measure government effort as judged in Washington, not how much trafficking takes place, so a better grade does not mean fewer victims.</p><ul><li>2024 report: Tier 1 33, Tier 2 98, Watch List 32, Tier 3 21, special cases 4.</li><li>2025 report: Tier 1 33, Tier 2 106, Watch List 25, Tier 3 20, special cases 4.</li><li>2026 report: Tier 1 35, Tier 2 111, Watch List 18, Tier 3 20, special cases 4 (Haiti, Libya, Somalia, Yemen).</li><li>2026 report global law-enforcement data for 2025: 24,254 prosecutions, 7,576 convictions and 156,912 victims identified.</li><li>La Strada International: 19 European countries in Tier 1, the same as last year; Russia and Belarus are Europe&#x27;s only Tier 3 countries.</li></ul><p>Sources: <a href="https://www.state.gov/reports/2026-trafficking-in-persons-report">US State Department: 2026 Trafficking in Persons Report (tier placements list)</a> <a href="https://www.state.gov/reports/2025-trafficking-in-persons-report">US State Department: 2025 Trafficking in Persons Report</a> <a href="https://www.state.gov/reports/2024-trafficking-in-persons-report">US State Department: 2024 Trafficking in Persons Report</a> <a href="https://www.lastradainternational.org/news/us-tip-report-published-after-a-3-month-delay/">La Strada International: US TIP Report Published After a 3-Month Delay (Nov 3, 2026)</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-22-T10.webp" alt="TIP 2026: 15 upgrades, 6 downgrades; Syria leaves Tier 3 as Hong Kong drops into it" loading="lazy"><figcaption><span class="t">Chart T10 (week of Nov 22, 2026). TIP 2026: 15 upgrades, 6 downgrades; Syria leaves Tier 3 as Hong Kong drops into it</span><p>Every country whose Trafficking in Persons grade changed between the 2025 and 2026 reports. Upgrades outnumbered downgrades 15 to 6. Israel, Norway and Ghana rose to Tier 1 while Seychelles fell out of it; Syria and Papua New Guinea left Tier 3 for the Watch List; Hong Kong and the Republic of the Congo were dropped to Tier 3, joining China, Russia, North Korea, Iran and others. Syria&#x27;s upgrade follows the change of government in Damascus at the end of 2024. Tier moves are diplomatic as well as technical judgments: the report grades government effort against US standards, and an upgrade can reflect new laws or cooperation with Washington rather than fewer victims on the ground.</p><ul><li>Upgraded to Tier 1: Israel, Norway, Ghana. Downgraded from Tier 1: Seychelles.</li><li>Off the Watch List to Tier 2: Brunei, Burkina Faso, Cabo Verde, Djibouti, Liberia, Niger, Solomon Islands, Tunisia, Turkmenistan, Vanuatu.</li><li>Onto the Watch List from Tier 2: Central African Republic, Comoros, Namibia. Into Tier 3: Hong Kong, Republic of the Congo. Out of Tier 3: Syria, Papua New Guinea.</li><li>2026 Tier 3: Afghanistan, Belarus, Burma, Cambodia, Chad, China, Republic of the Congo, Cuba, Eritrea, Hong Kong, Iran, North Korea, Laos, Macau, Nicaragua, Russia, Sint Maarten, South Sudan, Sudan, Venezuela.</li></ul><p>Sources: <a href="https://www.state.gov/reports/2026-trafficking-in-persons-report">US State Department: 2026 Trafficking in Persons Report (tier placements list)</a> <a href="https://www.state.gov/reports/2025-trafficking-in-persons-report">US State Department: 2025 Trafficking in Persons Report</a></p></figcaption></figure></main></body></html>
