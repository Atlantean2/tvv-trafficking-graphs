<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Trafficking Graphs — Q7</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q7")</script></head><body><main id="issue"><h2 class="desk">Q7. Conviction Gap</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-10-25-T1.webp" alt="The conviction gap: global trafficking prosecutions vs convictions, 2019-2025" loading="lazy"><figcaption><span class="t">Chart T1 (week of Oct 25, 2026). The conviction gap: global trafficking prosecutions vs convictions, 2019-2025</span><p>New in the 2026 TIP Report: governments reported a record 24,254 trafficking prosecutions in 2025, up 54% on 2024, but convictions fell to 7,576. In 2019 there were 81 convictions per 100 prosecutions; in 2025 just 31. Much of the 2025 jump came from the Near East (6,568 prosecutions vs 1,743 in 2024) and South &amp; Central Asia (5,734 vs 2,754). The State Department warns these are estimates from government data that &#x27;fluctuate&#x27; with uneven national reporting. This year&#x27;s report itself names the cause: &#x27;Failures in victim protection and support are a primary reason for unsuccessful prosecutions.&#x27;</p><p>Sources: <a href="https://www.state.gov/reports/2026-trafficking-in-persons-report">US State Dept, 2026 Trafficking in Persons Report, Global Law Enforcement Data</a></p></figcaption></figure></main></body></html>
